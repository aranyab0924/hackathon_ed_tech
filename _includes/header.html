<header class="bg-gray-900 border-b border-gray-700 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="relative flex items-center justify-between h-16">
      <!-- Left side: Discover + Learn -->
      <nav class="hidden md:flex items-center gap-8 lg:gap-10">
        <a
          href="/discover"
          class="text-gray-300 hover:text-indigo-400 font-medium transition-colors"
        >
          Discover
        </a>
        <a
          href="/learn"
          class="text-gray-300 hover:text-indigo-400 font-medium transition-colors"
        >
          Learn
        </a>
      </nav>

      <!-- Center: Logo / App title -->
      <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
        <a href="/{{site.baseurl}}" class="text-2xl font-bold text-gray-100 whitespace-nowrap">
          Your<span class="text-indigo-400">App</span>
        </a>
      </div>

      <!-- Right side: Login -->
      <div class="flex items-center gap-4">
        <a
          href="/login"
          class="text-gray-300 hover:text-gray-100 font-medium px-4 py-2 transition"
        >
          Log in
        </a>

        <!-- Optional signup button (you can remove it) -->
        <a
          href="/signup"
          class="bg-indigo-500 text-white px-5 py-2 rounded-lg font-medium hover:bg-indigo-600 transition shadow-sm hidden sm:block"
        >
          Sign up
        </a>
      </div>
    </div>
  </div>
</header>
