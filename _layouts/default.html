<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
      {% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}
    </title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
    {% include header.html %}

    <!-- Main content anchored to top (below the sticky header). Dark themed: darker card and subtle border. -->
    <main class="bg-gray-800 w-full max-w-4xl mx-auto shadow-2xl px-4 sm:px-6 md:px-8 lg:px-10 py-6 sm:py-8 rounded-2xl overflow-hidden border border-gray-700 mt-8 text-gray-100">
      {{ content }}
    </main>
</body>
</html>
