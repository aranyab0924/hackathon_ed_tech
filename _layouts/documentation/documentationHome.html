---
layout: default
---

<div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8 pt-8">
  <div class="grid gap-6">
    {% for page in site.posts %}
    <div
      class="group relative overflow-hidden rounded-xl border border-gray-200 bg-white p-6 shadow-sm transition-all hover:shadow-md hover:border-gray-300 focus-within:ring-2 focus-within:ring-blue-500 focus-within:ring-offset-2"
    >
      <h2 class="text-xl font-semibold leading-tight text-gray-900">
        <a
          href="{{ page.url | relative_url }}"
          class="after:absolute after:inset-0 hover:text-blue-600 transition-colors"
        >
          {{ page.title }}
        </a>
      </h2>

      {% if page.description or page.excerpt %}
      <p class="mt-3 text-gray-600 line-clamp-2">
        {{ page.description | default: page.excerpt | strip_html | truncate: 160
        }}
      </p>
      {% endif %}
    </div>
    {% endfor %}
  </div>
</div>
