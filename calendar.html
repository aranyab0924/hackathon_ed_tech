title: Calendar
---

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Planner Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6">
  <div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-semibold">Planner Calendar</h1>
      <div>
        <button id="todayBtn" class="px-3 py-1 bg-slate-700 text-white rounded mr-2">Today</button>
        <a href="{{ site.baseurl }}/statspage" class="px-3 py-1 bg-slate-100 border rounded text-slate-700">Back to Stats</a>
      </div>
    </div>

    <div class="bg-white p-4 rounded shadow">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <button id="prevMonth" class="px-3 py-1 bg-slate-100 rounded">&larr;</button>
          <div id="monthLabel" class="text-lg font-medium"></div>
          <button id="nextMonth" class="px-3 py-1 bg-slate-100 rounded">&rarr;</button>
        </div>
        <div>
          <button id="clearAll" class="px-3 py-1 bg-red-100 text-red-700 rounded">Clear all events</button>
        </div>
      </div>

      <div id="calendar" class="grid grid-cols-7 gap-1">
        <!-- Weekday headers -->
      </div>
    </div>

    <div id="note" class="mt-4 text-sm text-slate-600">Click any date to add an event. Events are stored in your browser localStorage only.</div>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded shadow-lg p-4">
      <div class="flex justify-between items-center mb-2">
        <h2 id="modalDate" class="text-lg font-semibold">Date</h2>
        <button id="closeModal" class="text-slate-500">Close</button>
      </div>
      <div id="eventsList" class="mb-4 space-y-2">
        <!-- existing events -->
      </div>
      <form id="eventForm" class="space-y-3">
        <input id="eventTitle" placeholder="Event title" class="w-full border rounded px-2 py-1" required />
        <input id="eventTime" type="time" class="w-full border rounded px-2 py-1" />
        <textarea id="eventDesc" placeholder="Notes (optional)" class="w-full border rounded px-2 py-1" rows="3"></textarea>
        <div class="flex justify-end gap-2">
          <button type="button" id="addEventBtn" class="px-3 py-1 bg-slate-700 text-white rounded">Add Event</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Calendar with localStorage persistence
    const KEY = 'calendar_events'; // stored as { 'YYYY-MM-DD': [ {id,title,time,desc} ] }

    // Utilities
    const pad = n => n.toString().padStart(2,'0');
    const iso = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
    function loadEvents(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
    function saveEvents(obj){ localStorage.setItem(KEY, JSON.stringify(obj)); }

    // State
    let viewDate = new Date(); // current month view
    let events = loadEvents();

    // DOM
    const calendarEl = document.getElementById('calendar');
    const monthLabel = document.getElementById('monthLabel');
    const modal = document.getElementById('modal');
    const modalDateEl = document.getElementById('modalDate');
    const eventsList = document.getElementById('eventsList');
    const eventForm = document.getElementById('eventForm');
    const eventTitle = document.getElementById('eventTitle');
    const eventTime = document.getElementById('eventTime');
    const eventDesc = document.getElementById('eventDesc');
    const addEventBtn = document.getElementById('addEventBtn');

    function renderCalendar(){
      calendarEl.innerHTML = '';
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const first = new Date(year, month, 1);
      const last = new Date(year, month + 1, 0);
      const startDay = first.getDay(); // 0 Sun..6 Sat

      monthLabel.textContent = first.toLocaleString(undefined, { month: 'long', year: 'numeric' });

      // weekday headers
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      for(const d of days){
        const h = document.createElement('div');
        h.className = 'text-center font-medium text-sm text-slate-600 py-2';
        h.textContent = d;
        calendarEl.appendChild(h);
      }

      // blanks before first day
      for(let i=0;i<startDay;i++){
        const blank = document.createElement('div');
        blank.className = 'h-20 border p-1 bg-slate-50';
        calendarEl.appendChild(blank);
      }

      for(let day = 1; day <= last.getDate(); day++){
        const date = iso(year, month+1, day);
        const cell = document.createElement('div');
        cell.className = 'h-28 border p-2 bg-white flex flex-col justify-between cursor-pointer hover:bg-slate-50';
        cell.dataset.date = date;

        const top = document.createElement('div');
        top.className = 'flex justify-between items-start';
        const dnum = document.createElement('div'); dnum.className='text-sm font-medium'; dnum.textContent = day;
        const badge = document.createElement('div'); badge.className='text-xs text-white bg-indigo-500 rounded-full px-2 py-0.5 hidden';
        top.appendChild(dnum); top.appendChild(badge);
        cell.appendChild(top);

        const evContainer = document.createElement('div'); evContainer.className='text-xs text-slate-700';
        const todays = events[date] || [];
        if(todays.length){
          badge.textContent = String(todays.length);
          badge.classList.remove('hidden');
          // show up to 2 events inline
          todays.slice(0,2).forEach(e=>{
            const el = document.createElement('div'); el.className='truncate'; el.textContent = (e.time?e.time+' ':'') + e.title; evContainer.appendChild(el);
          });
          if(todays.length>2){ const more = document.createElement('div'); more.className='text-xs text-slate-500'; more.textContent = '…+'+(todays.length-2)+' more'; evContainer.appendChild(more); }
        }
        cell.appendChild(evContainer);

        cell.addEventListener('click', ()=> openModal(date));
        calendarEl.appendChild(cell);
      }

      // Fill trailing blanks to keep grid shape
      const totalCells = calendarEl.children.length;
      const needed = (7 - (totalCells % 7)) % 7;
      for(let i=0;i<needed;i++){ const b=document.createElement('div'); b.className='h-20 border bg-slate-50'; calendarEl.appendChild(b); }
    }

    function openModal(date){
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      modalDateEl.textContent = new Date(date).toLocaleDateString();
      modal.dataset.date = date;
      renderEventsList(date);
    }
    function closeModal(){ modal.classList.add('hidden'); modal.classList.remove('flex'); clearForm(); }

    function renderEventsList(date){
      eventsList.innerHTML = '';
      const list = events[date] || [];
      if(list.length===0){ eventsList.innerHTML = '<div class="text-sm text-slate-500">No events for this date yet.</div>'; return; }
      list.forEach((ev, idx)=>{
        const row = document.createElement('div'); row.className='flex items-start justify-between gap-2 p-2 border rounded';
        const left = document.createElement('div'); left.innerHTML = `<div class="font-medium">${ev.title}</div><div class="text-xs text-slate-500">${ev.time||''}</div><div class="text-xs text-slate-600">${ev.desc||''}</div>`;
        const right = document.createElement('div');
        const del = document.createElement('button'); del.className='text-sm text-red-600'; del.textContent='Delete';
        del.addEventListener('click', ()=>{ deleteEvent(date, idx); });
        right.appendChild(del);
        row.appendChild(left); row.appendChild(right);
        eventsList.appendChild(row);
      });
    }

    function clearForm(){ eventTitle.value=''; eventTime.value=''; eventDesc.value=''; }

    function addEvent(){
      const date = modal.dataset.date;
      const title = eventTitle.value.trim();
      if(!title){ alert('Please enter a title for the event.'); return; }
      const ev = { id: Date.now(), title, time: eventTime.value || '', desc: eventDesc.value || '' };
      events[date] = events[date] || [];
      events[date].push(ev);
      saveEvents(events);
      renderEventsList(date);
      renderCalendar();
      clearForm();
    }

    function deleteEvent(date, idx){
      if(!events[date]) return;
      events[date].splice(idx,1);
      if(events[date].length===0) delete events[date];
      saveEvents(events);
      renderEventsList(date);
      renderCalendar();
    }

    // Clear all events after confirmation
    document.getElementById('clearAll').addEventListener('click', ()=>{
      if(confirm('Remove all saved events? This cannot be undone.')){ events = {}; saveEvents(events); renderCalendar(); }
    });

    document.getElementById('prevMonth').addEventListener('click', ()=>{ viewDate.setMonth(viewDate.getMonth()-1); renderCalendar(); });
    document.getElementById('nextMonth').addEventListener('click', ()=>{ viewDate.setMonth(viewDate.getMonth()+1); renderCalendar(); });
    document.getElementById('todayBtn').addEventListener('click', ()=>{ viewDate = new Date(); renderCalendar(); });
    document.getElementById('closeModal').addEventListener('click', closeModal);
    addEventBtn.addEventListener('click', addEvent);

    // Close modal on backdrop
    modal.addEventListener('click', (e)=>{ if(e.target===modal) closeModal(); });

    // Initial render
    renderCalendar();
  </script>
</body>
</html>
